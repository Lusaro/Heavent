<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./img/TU_navicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="./img/TU_navicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Heavent - Team</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0b0d0f;
            --bg-secondary: #14181c;
            --bg-card: #1a1f26;
            --text-primary: #ffffff;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7a8f;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --border-color: #2a3440;
        }

        body {
            background-color: var(--bg-primary);
            overflow-y: scroll;
            overflow-x: hidden;
            scrollbar-width: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }
        body::-webkit-scrollbar { display: none; }

        header {
            position: relative;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
        }

        #header-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        #header-poster {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('img/blätter.jpg');
            background-size: cover;
            background-position: center;
            z-index: 0;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #header-poster.visible {
            display: block;
            opacity: 1;
            z-index: 1;
        }

        .header-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .header-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -100%);
            font-family: "Playfair Display", serif;
            font-style: italic;
            font-weight: normal;
            font-size: 150px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 3;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        a { text-decoration: none; }

        .impressum-box {
            position: absolute;
            top: 20px;
            background-color: transparent;
            border: 2px solid var(--text-secondary);
            border-radius: 10px;
            padding: 10px 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            z-index: 4;
        }
        .impressum-box-left { left: 20px; right: auto; }
        .impressum-box-right { right: 20px; left: auto; }
        .impressum-text { font-size: 18px; font-weight: bold; margin: 0; color: var(--text-primary); }

        .content-container {
            max-width: 1400px;
            margin: 0;
            padding: 0 20px;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 0 60px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .slider-wrapper {
            display: flex;
            justify-content: flex-start;
            height: auto;
            min-height: 200px;
            width: 100%;
            transition: transform 0.5s ease-in-out;
            gap: 0;
            transform: translateX(0);
            flex-wrap: nowrap;
            overflow: visible;
            padding: 20px 0;
        }

        .slider {
            margin: 0.5rem 1rem;
            width: 90%;
            min-width: 280px;
            max-width: 320px;
            flex-shrink: 0;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), rgba(77, 77, 77, 0.2));
            backdrop-filter: blur(100px);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .slider:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.2);
            border-color: var(--accent-purple);
        }

        .image { position: relative; }
        .image img {
            padding: 10px;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            box-sizing: border-box;
            display: block;
            image-rendering: pixelated;
        }

        .product-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .product-name {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .product-name a {
            color: var(--text-primary);
            margin: 2px 0;
            font-size: 18px;
            font-weight: bolder;
        }
        .product-name span {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: var(--text-secondary);
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            border: 1px solid var(--border-color);
        }
        .arrow:hover {
            color: #fff;
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .arrow-left { left: 0; }
        .arrow-right { right: 0; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 24px;
            color: var(--text-primary);
            z-index: 2;
            padding: 30px 0 10px 20px;
        }

        .section-title {
            display: inline-block;
            position: relative;
        }

        .pokemon-icon { width: 48px; height: 48px; margin-right: 10px; }

        .team-loading {
            color: var(--text-muted);
            padding: 30px;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .header-text { font-size: 80px; }
            .section-header { padding: 20px 0 10px 10px; font-size: 18px; }
            .slider { min-width: 220px; max-width: 260px; }
            .slider-container { padding: 0 40px; }
            .arrow { font-size: 28px; padding: 6px 12px; }
            .product-name a { font-size: 16px; }
        }

        @media (max-width: 480px) {
            .slider { min-width: 160px; max-width: 200px; }
            .slider-container { padding: 0 20px; }
            .arrow { font-size: 20px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-overlay"></div>
        <video id="header-video" autoplay muted playsinline>
            <source src="HVNT-Video.mp4" type="video/mp4">
            <source src="video.webm" type="video/webm">
        </video>
        <div id="header-poster"></div>

        <div class="impressum-box impressum-box-left">
            <a href="index.html"><p class="impressum-text">Zurück</p></a>
        </div>
        <div class="impressum-box impressum-box-right">
            <a href="https://discord.gg/utngw94B7b"><p class="impressum-text">Bewerben</p></a>
        </div>

        <div class="header-text">Das Team</div>
    </header>

    <script>
        const headerOverlay = document.querySelector('.header-overlay');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const opacity = Math.min(2, scrollY / 1000);
            headerOverlay.style.backgroundColor = `rgba(0, 0, 0, ${opacity})`;
        });

        const video = document.getElementById('header-video');
        const poster = document.getElementById('header-poster');
        const text = document.querySelector('.header-text');

        function showPoster() {
            video.style.display = 'none';
            video.style.visibility = 'hidden';
            poster.classList.add('visible');
            text.style.opacity = '1';
        }

        video.addEventListener('timeupdate', function() {
            if (video.duration && (video.currentTime / video.duration) >= 0.85) {
                text.style.opacity = '1';
            }
        });
        video.addEventListener('ended', showPoster);
        video.addEventListener('error', showPoster);
        setTimeout(() => {
            if (video.paused) {
                showPoster();
                text.style.opacity = '1';
            }
        }, 5000);
        video.addEventListener('timeupdate', function() {
            if (video.duration && (video.currentTime / video.duration) >= 0.95) {
                showPoster();
            }
        });
    </script>

    <div class="content-container">

        <div class="section-header" style="margin-top: 60px;">
            <img src="crown.png" alt="Krone" class="pokemon-icon">
            <h1 class="section-title">Leitung</h1>
        </div>
        <div class="slider-container">
            <div class="slider-wrapper" id="sliderWrapper1">
                <div class="team-loading">Lade Team...</div>
            </div>
            <i class="fas fa-chevron-left arrow arrow-left" onclick="scrollSlider('sliderWrapper1', -1)"></i>
            <i class="fas fa-chevron-right arrow arrow-right" onclick="scrollSlider('sliderWrapper1', 1)"></i>
        </div>

        <div class="section-header" style="margin-top: 40px;">
            <img src="picke.png" alt="Farmer Icon" style="height: 35px; width: auto; margin-right: 10px;">
            <h1 class="section-title">Farmer</h1>
        </div>
        <div class="slider-container">
            <div class="slider-wrapper" id="sliderWrapper2">
                <div class="team-loading">Lade Team...</div>
            </div>
            <i class="fas fa-chevron-left arrow arrow-left" onclick="scrollSlider('sliderWrapper2', -1)"></i>
            <i class="fas fa-chevron-right arrow arrow-right" onclick="scrollSlider('sliderWrapper2', 1)"></i>
        </div>

        <div class="section-header" style="margin-top: 40px;">
            <img src="block.png" alt="Builder Icon" style="height: 35px; width: auto; margin-right: 10px;">
            <h1 class="section-title">Builder</h1>
        </div>
        <div class="slider-container">
            <div class="slider-wrapper" id="sliderWrapper3">
                <div class="team-loading">Lade Team...</div>
            </div>
            <i class="fas fa-chevron-left arrow arrow-left" onclick="scrollSlider('sliderWrapper3', -1)"></i>
            <i class="fas fa-chevron-right arrow arrow-right" onclick="scrollSlider('sliderWrapper3', 1)"></i>
        </div>

    </div>

    <script>
        function scrollSlider(wrapperId, direction) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;
            const slider = wrapper.querySelector('.slider');
            if (!slider) return;
            const sliderWidth = slider.offsetWidth;
            const style = window.getComputedStyle(slider);
            const marginLeft = parseFloat(style.marginLeft) || 0;
            const marginRight = parseFloat(style.marginRight) || 0;
            const totalWidth = sliderWidth + marginLeft + marginRight;
            const wrapperStyle = window.getComputedStyle(wrapper);
            const wrapperWidth = wrapper.clientWidth - parseFloat(wrapperStyle.paddingLeft) - parseFloat(wrapperStyle.paddingRight);
            const visibleCards = Math.floor(wrapperWidth / totalWidth);
            if (visibleCards <= 0) return;
            let currentTransform = 0;
            const transform = wrapper.style.transform;
            if (transform) {
                const match = transform.match(/translateX\(([^)]+)\)/);
                if (match) currentTransform = parseFloat(match[1]);
            }
            const totalCards = wrapper.children.length;
            const maxScroll = Math.max(0, (totalCards - visibleCards) * totalWidth);
            const step = totalWidth;
            let newTransform = currentTransform - (direction * step);
            newTransform = Math.max(-maxScroll, Math.min(0, newTransform));
            wrapper.style.transform = `translateX(${newTransform}px)`;
            wrapper.style.transition = 'transform 0.5s ease-in-out';
        }

        function renderTeam(members, wrapperId, roleLabel) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;
            if (!members || members.length === 0) {
                wrapper.innerHTML = '<div class="team-loading">Keine Mitglieder</div>';
                wrapper.style.transform = 'translateX(0)';
                return;
            }
            wrapper.innerHTML = members.map(m => `
                <div class="slider">
                    <div class="image">
                        <img src="${m.head_url || 'https://mc-heads.net/head/Steve'}" alt="Head von ${m.mc_name}" onerror="this.onerror=null; this.src='https://mc-heads.net/head/Steve';" />
                    </div>
                    <div class="product-details">
                        <div class="product-name">
                            <a>${m.mc_name}</a>
                            <span>${roleLabel}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            wrapper.style.transform = 'translateX(0)';
        }

        async function loadLiveTeam() {
            try {
                const res = await fetch('./data/team.json');
                if (!res.ok) throw new Error('team.json nicht erreichbar');
                const data = await res.json();
                renderTeam(data.leitung || [], 'sliderWrapper1', 'Leitung');
                renderTeam(data.farmer || [], 'sliderWrapper2', 'Farmer');
                renderTeam(data.builder || [], 'sliderWrapper3', 'Builder');
                console.log('✅ Team geladen');
            } catch (err) {
                console.error('❌ Team laden fehlgeschlagen:', err);
                document.querySelectorAll('.slider-wrapper').forEach(w => {
                    w.innerHTML = '<div class="team-loading" style="color:#ff4444;">Team konnte nicht geladen werden</div>';
                });
            }
        }

        document.addEventListener('DOMContentLoaded', loadLiveTeam);
    </script>

</body>
</html>
